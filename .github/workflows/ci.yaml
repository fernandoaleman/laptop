name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned validation tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/laptop-tools"
          mkdir -p "$tools_dir"
          curl -fsSL -o "$tools_dir/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSL -o "$tools_dir/shfmt" https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          curl -fsSL -o "$tools_dir/typos.tar.gz" https://github.com/crate-ci/typos/releases/download/v1.51.1/typos-v1.51.1-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o "$tools_dir/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          cd "$tools_dir"
          sha256sum --check --strict <<'CHECKSUMS'
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz
          76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt
          93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454  typos.tar.gz
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
          CHECKSUMS
          tar -xJf shellcheck.tar.xz
          cp shellcheck-v0.11.0/shellcheck shellcheck
          tar -xzf typos.tar.gz ./typos
          tar -xzf actionlint.tar.gz actionlint
          chmod +x "$tools_dir/shfmt"
          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: Run checks
        run: make check
      - name: Check GitHub Actions workflow
        run: actionlint .github/workflows/ci.yaml
  macos-bootstrap:
    name: macos-bootstrap (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner platform
        run: |
          sw_vers
          uname -m
          /bin/bash --version
          test "$(uname -m)" = arm64
      - name: Test fixtures with macOS Bash
        run: /bin/bash tests/bootstrap.sh
