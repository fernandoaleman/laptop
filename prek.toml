default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.11"
hooks = [{ id = "committed", stages = ["commit-msg"] }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos" }]

[[repos]]
repo = "local"
hooks = [
  { id = "shellcheck", name = "ShellCheck", language = "system", entry = "shellcheck -s bash", files = "^laptop$" },
  { id = "shfmt", name = "shfmt", language = "system", entry = "shfmt -d -i 2", files = "^laptop$" },
]
